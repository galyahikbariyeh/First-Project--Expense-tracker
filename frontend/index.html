<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>



  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg bg-dark">
    <div class="container">
      <a class="navbar-brand text-light" href="#">
        Expense Tracker
      </a>
      <button id="darkModeBtn" class="btn ms-auto">
        <i class="bi bi-moon"></i>
      </button>
    </div>


  </nav>
  
  <!-- Main -->
  <main>

    <div id="alertContainer"></div>

     <!-- Summary cards -->
    <div class="container mt-4">
      <div class="summary-cards">

        <div class="mb-3">
          <div class="card h-100">
            <div class="card-body p-4 text-center">
              <h5 class="card-title text-body-tertiary">Total Amount</h5>
              <h3 id="totalAmount">Jod0.00</h3>
            </div>
          </div>
        </div>

        <div class="mb-3">
          <div class="card h-100">
            <div class="card-body p-4 text-center">
              <h5 class="card-title text-body-tertiary">Number of Expenses</h5>
              <h3 id="expenseCount">0</h3>
            </div>
          </div>
        </div>

        <div class="mb-3">
          <div class="card h-100">
            <div class="card-body p-4 text-center">
              <h5 class="card-title text-body-tertiary">Highest Expense</h5>
              <h3 id="highestExpense">Jod0.00</h3>
              <p id="highestExpenseTitle" class="text-secondary mb-0"></p>
            </div>
          </div>
        </div>

      </div>
    </div>
    <!-- Add Expense form -->
    <div class="container mt-2">

      <div class="card">
        <div class="card-body p-4">

          <h3 class="card-title mb-4 ">Add Expense</h3>

          <form id="expenseForm">

            <div class="row">


              <div class="col-md-3 mb-3">
                <label for="title" class="form-label text-secondary">Title</label>
                <input type="text" id="title" class="form-control" placeholder="Enter title">
                <div class="invalid-feedback">
                  Title is required.
                </div>
              </div>


              <div class="col-md-3 mb-3">
                <label for="amount" class="form-label text-secondary">Amount</label>
                <input type="number" id="amount" class="form-control" step="0.01" placeholder="Enter amount">
                <div class="invalid-feedback">
                  Enter an amount greater than 0.
                </div>

              </div>

              <div class="col-md-3 mb-3">
                <label for="category" class="form-label text-secondary">Category</label>
                <select id="category" class="form-select">
                  <option value="">Choose...</option>
                  <option value="Food">Food</option>
                  <option value="Transport">Transport</option>
                  <option value="Bills">Bills</option>
                  <option value="Entertainment">Entertainment</option>
                  <option value="Other">Other</option>
                </select>
                <div class="invalid-feedback">
                  Choose a category.
                </div>

              </div>

              <div class="col-md-3 mb-3">
                <label for="date" class="form-label text-secondary">Date</label>
                <input type="date" id="date" class="form-control">
                <div class="invalid-feedback">
                  Date is required.
                </div>

              </div>

            </div>


            <button type="submit" class="btn btn-primary">
              Add Expense
            </button>

          </form>

        </div>
      </div>

    </div>
    <div class="container mt-4">

      <div class="card">
        <div class="card-body p-4">


          <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-3">

            <h3 class="mb-0">Expenses</h3>

            <div class="expense-filters">


              <div class="filter-item">
                <label for="titleFilter" class="form-label mb-1">Title</label>
                <input type="text" id="titleFilter" class="form-control" placeholder="Search title">
              </div>


              <div class="filter-item">
                <label for="monthFilter" class="form-label mb-1">Month</label>
                <input type="month" id="monthFilter" class="form-control">
              </div>


              <div class="filter-item">
                <label for="categoryFilter" class="form-label mb-1">Category</label>
                <select id="categoryFilter" class="form-select">
                  <option value="All">All</option>
                  <option value="Food">Food</option>
                  <option value="Transport">Transport</option>
                  <option value="Bills">Bills</option>
                  <option value="Entertainment">Entertainment</option>
                  <option value="Other">Other</option>
                </select>
              </div>

            </div>

          </div>
          <div id="spinner" class="text-center my-3 d-none">
            <div class="spinner-border" role="status">
              <span class="visually-hidden">Loading...</span>
            </div>
          </div>
           <!-- Table -->
          <div class="table-responsive">
            <table class="table table-striped align-middle mb-0 text-center">

              <thead>
                <tr>
                  <th>Title</th>
                  <th>Amount</th>
                  <th>Category</th>
                  <th>Date</th>
                  <th>Actions</th>
                </tr>
              </thead>

              <tbody id="expensesTableBody">

              </tbody>

            </table>
          </div>

        </div>
      </div>

    </div>
     <!-- Edit Expense form -->
    <div class="modal fade" id="editModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">

          <div class="modal-header">
            <h5 class="modal-title">Edit Expense</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>

          <div class="modal-body">

            <form id="editForm">

              <div class="mb-3">
                <label for="editTitle" class="form-label">Title</label>
                <input type="text" id="editTitle" class="form-control">
              </div>

              <div class="mb-3">
                <label for="editAmount" class="form-label">Amount</label>
                <input type="number" id="editAmount" class="form-control" step="0.01">
              </div>

              <div class="mb-3">
                <label for="editCategory" class="form-label">Category</label>
                <select id="editCategory" class="form-select">
                  <option value="">Choose...</option>
                  <option value="Food">Food</option>
                  <option value="Transport">Transport</option>
                  <option value="Bills">Bills</option>
                  <option value="Entertainment">Entertainment</option>
                  <option value="Other">Other</option>
                </select>
              </div>

              <div class="mb-3">
                <label for="editDate" class="form-label">Date</label>
                <input type="date" id="editDate" class="form-control">
              </div>

              <div class="modal-footer mt-4">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                <button type="submit" class="btn btn-primary">Save changes</button>
              </div>

            </form>

          </div>

        </div>
      </div>
    </div>
  </main>


  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
</body>

</html>
